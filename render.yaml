services:
  - type: web
    name: skill-sharp-lms
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./eduai.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: ENABLE_EMAIL
        value: "false"
      - key: ENABLE_REDIS
        value: "false"
