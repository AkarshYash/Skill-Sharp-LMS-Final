services:
  - type: web
    name: skill-sharp-lms
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./eduai.db
      - key: SECRET_KEY
        value: skillsharp365_prod_secret_key_2026_do_not_change
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: FRONTEND_URL
        value: https://skill-sharp-lms.onrender.com
      - key: GEMINI_API_KEY
        value: AIzaSyC1_Kr6uGRC3bUSFVpwlzyCNMfV6n46cnc
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: OPENAI_API_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: ENABLE_EMAIL
