name: CI/CD — Skills Sharp 365 LMS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Test ───────────────────────────────────────────
  test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database (smoke test)
        run: python seed.py
        env:
          DATABASE_URL: sqlite:///./eduai.db
          SECRET_KEY: ci_test_secret_key_32chars_minimum
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Start server & health-check
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/ || exit 1
        env:
          DATABASE_URL: sqlite:///./eduai.db
          SECRET_KEY: ci_test_secret_key_32chars_minimum
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""

  # ── 2. Docker Build ──────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skillsharp365:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 \
            -e SECRET_KEY=ci_test_secret_key_32chars \
            -e DATABASE_URL=sqlite:///./eduai.db \
            --name lms_test skillsharp365:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8000/health || (docker logs lms_test && exit 1)
          docker stop lms_test

  # ── 3. Deploy to Render ──────────────────────────────────────
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deploy triggered"
          else
            echo "ℹ️  No RENDER_DEPLOY_HOOK_URL secret set — Render auto-deploys on git push"
          fi
